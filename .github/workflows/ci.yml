name: CI

# Fork CI — test checks only. Ren wants PR checks limited to Devin Review +
# CI tests (AGENTS.md fork-wins rules), so this replaces upstream's ci.yml:
# no lint/format/type-check, build, migration-chain, or openapi-spec jobs.
# No paths filter on either trigger so `gate` reports on every PR — required
# checks that never run deadlock merges.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: open-wearables
          POSTGRES_PASSWORD: open-wearables
          POSTGRES_DB: open_wearables_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://open-wearables:open-wearables@localhost:5432/open_wearables_test
      TEST_REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci-at-least-32-chars
      MASTER_KEY: dGVzdC1tYXN0ZXIta2V5LWZvci10ZXN0aW5nLW9ubHk=
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev --extra otel
      - name: Run tests
        working-directory: backend
        run: uv run pytest -v
      - name: Run OpenTelemetry tests without the otel extra
        working-directory: backend
        run: |
          uv sync --group dev
          uv run pytest -v tests/utils_tests/test_otel_wiring.py tests/utils_tests/test_otel_export.py

  mcp-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install dependencies
        working-directory: mcp
        run: uv sync --group dev
      - name: Run tests
        working-directory: mcp
        run: uv run pytest -v

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      # Component tests run in a real Chromium too, not only e2e.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
      - name: Install Playwright Chromium
        working-directory: frontend
        run: bunx playwright install --with-deps chromium
      - name: Unit and component tests
        working-directory: frontend
        run: bun run test:unit --run
      - name: End-to-end tests
        working-directory: frontend
        run: bunx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Single check branch protection requires. Runs even when a test job is
  # skipped; fails if any needed job failed or was cancelled.
  gate:
    name: gate
    needs:
      - backend-test
      - mcp-test
      - frontend-test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        run: |
          echo '${{ toJSON(needs) }}' | jq -e '
            to_entries | map(.value.result) |
            all(. == "success" or . == "skipped")
          '
