# CI/CD: build the backend and frontend images, push them to Artifact
# Registry, and deploy each to its own Cloud Run service.
#
# "On commit to main" is configured on the Cloud Build trigger with branch
# filter `^main$`, not in this file.
#
# The Cloud Build execution service account requires Artifact Registry Writer,
# Cloud Run Admin, and Service Account User on both runtime service accounts.
#
# Runtime env vars for the backend Cloud Run service are supplied two ways:
#   - Non-secret config via the _BACKEND_* substitutions below (--set-env-vars).
#   - Secrets pulled from Secret Manager at runtime (--set-secrets). Cloud Run
#     resolves these itself, so the RUNTIME service account
#     (_BACKEND_SERVICE_ACCOUNT) needs the Secret Manager Secret Accessor role
#     on each referenced secret. Create the secrets once, e.g.:
#       printf 'value' | gcloud secrets create open-wearables-secret-key --data-file=-
# Override any substitution per-environment on the Cloud Build trigger.

substitutions:
  _REGION: us-central1
  _BACKEND_IMAGE: us-central1-docker.pkg.dev/front-back-labs/ren-backend/open-wearables-backend
  _WORKER_IMAGE: us-central1-docker.pkg.dev/front-back-labs/ren-backend/open-wearables-worker
  _BEAT_IMAGE: us-central1-docker.pkg.dev/front-back-labs/ren-backend/open-wearables-beat
  _FRONTEND_IMAGE: us-central1-docker.pkg.dev/front-back-labs/ren-backend/open-wearables-frontend
  _BACKEND_SERVICE: open-wearables-backend
  _FRONTEND_SERVICE: open-wearables-frontend
  _WORKER_SERVICE: open-wearables-worker
  _BEAT_SERVICE: open-wearables-beat
  _BACKEND_SERVICE_ACCOUNT: open-wearables@front-back-labs.iam.gserviceaccount.com
  _FRONTEND_SERVICE_ACCOUNT: open-wearables@front-back-labs.iam.gserviceaccount.com

  # --- Backend runtime config (non-secret) ---
  _ENVIRONMENT: production
  # Cloud SQL instance connection name (PROJECT:REGION:INSTANCE), mounted as a
  # Unix socket on the service via --add-cloudsql-instances below.
  _CLOUDSQL_INSTANCE: front-back-labs:us-central1:ren
  # Absolute path => psycopg connects over the Cloud SQL Unix socket (see
  # Settings.db_uri); no DB_PORT is needed. Keep in sync with _CLOUDSQL_INSTANCE.
  # For a direct TCP/IP connection instead, set this to the host/IP, add
  # DB_PORT back to --set-env-vars, and drop --add-cloudsql-instances.
  _DB_HOST: /cloudsql/front-back-labs:us-central1:ren
  _DB_NAME: open-wearables
  _REDIS_HOST: 10.10.0.8
  _REDIS_PORT: "6379"
  _API_BASE_URL: https://open-wearables-backend-474939749306.us-central1.run.app
  _API_PORT: "8080"
  _FRONTEND_URL: https://open-wearables-frontend-474939749306.us-central1.run.app
  _CORS_ALLOW_ALL: "true"
  _API_NAME: "Ren - Open Wearables API"

steps:
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=GIT_SHA=$COMMIT_SHA
      - --tag=${_BACKEND_IMAGE}:$SHORT_SHA
      - --tag=${_BACKEND_IMAGE}:latest
      - backend

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_BACKEND_IMAGE}"]

  # Celery worker: dedicated image built from backend/Dockerfile.worker. Its
  # baked CMD runs scripts/start/worker_cloudrun.sh, so no command override is
  # needed at deploy time.
  - id: build-worker
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=GIT_SHA=$COMMIT_SHA
      - --file=backend/Dockerfile.worker
      - --tag=${_WORKER_IMAGE}:$SHORT_SHA
      - --tag=${_WORKER_IMAGE}:latest
      - backend

  - id: push-worker
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_WORKER_IMAGE}"]

  # Celery beat: dedicated image built from backend/Dockerfile.beat. Its baked
  # CMD runs scripts/start/beat_cloudrun.sh.
  - id: build-beat
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=GIT_SHA=$COMMIT_SHA
      - --file=backend/Dockerfile.beat
      - --tag=${_BEAT_IMAGE}:$SHORT_SHA
      - --tag=${_BEAT_IMAGE}:latest
      - backend

  - id: push-beat
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_BEAT_IMAGE}"]

  # ---------------------------------------------------------------------------
  # Cloud SQL connection budget (DB_POOL_SIZE / DB_MAX_OVERFLOW /
  # DB_ASYNC_POOL_SIZE / DB_ASYNC_MAX_OVERFLOW below)
  #
  # max_connections is a property of the *instance*, not the database, and
  # ${_CLOUDSQL_INSTANCE} is shared with the Ren API gateway (which uses the
  # `postgres` database while we use `${_DB_NAME}`). The worker and beat run with
  # --min-instances=1, so their connections are held for the life of the revision
  # rather than released between tasks.
  #
  # On the 2 vCPU / 8 GB tier, max_connections (~400) is no longer the binding
  # constraint — the 2 vCPUs are. Postgres degrades when many backends are
  # *simultaneously active*, so these bound useful concurrency rather than
  # maximize it:
  #   steady state (pool_size, what stays open): api 2x10 + worker 8 + beat 2 = 30
  #   absolute peak (with max_overflow):        api 2x15 + worker 12 + beat 3 = 45
  # ...leaving ample room for the gateway's own pools and the ~7 reserved for
  # superuser/cloudsqladmin.
  #
  # DB_ASYNC_* stay 0: no endpoint takes AsyncDbSession, so that engine runs as a
  # NullPool and reserves nothing. Give it a size only when something uses it, and
  # take the budget out of the sync pool rather than adding it on top.
  #
  # These only hold if Cloud Run stops handing one instance more requests than its
  # pool can serve — hence --concurrency on the backend, and --concurrency=8 on the
  # Celery worker (in worker_cloudrun.sh). Raising a pool without raising the tier,
  # or raising concurrency without raising the pool, just moves the queue.
  # ---------------------------------------------------------------------------
  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_BACKEND_SERVICE}
      - --image=${_BACKEND_IMAGE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      # Bounded because each instance holds its own pools; unbounded autoscaling
      # here means unbounded Postgres backends.
      - --max-instances=2
      # Matched to the pool ceiling (DB_POOL_SIZE + DB_MAX_OVERFLOW = 15). The
      # default of 80 lets one instance accept far more concurrent requests than
      # it has connections for, so surplus requests block on pool checkout and
      # time out instead of being queued (or scaled) by the platform.
      - --concurrency=15
      - --service-account=${_BACKEND_SERVICE_ACCOUNT}
      # Mount the Cloud SQL instance as a Unix socket at /cloudsql/<instance>.
      - --add-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      # Non-secret config. Custom delimiter (^##^) so values may contain commas
      # (e.g. provider scopes).
      - >-
        --set-env-vars=^##^ENVIRONMENT=${_ENVIRONMENT}##DB_HOST=${_DB_HOST}##DB_NAME=${_DB_NAME}##REDIS_HOST=${_REDIS_HOST}##REDIS_PORT=${_REDIS_PORT}##API_BASE_URL=${_API_BASE_URL}##API_PORT=${_API_PORT}##FRONTEND_URL=${_FRONTEND_URL}##CORS_ALLOW_ALL=${_CORS_ALLOW_ALL}##API_NAME=${_API_NAME}##DB_POOL_SIZE=10##DB_MAX_OVERFLOW=5##DB_ASYNC_POOL_SIZE=0##DB_ASYNC_MAX_OVERFLOW=0
      # Secrets resolved from Secret Manager by Cloud Run at runtime
      # (ENV_VAR=SECRET_NAME:VERSION).
      - >-
        --set-secrets=DB_USER=ren-postgres-user-name:latest,DB_PASSWORD=ren-postgres-user-password:latest,ADMIN_EMAIL=ren-admin-email:latest,ADMIN_PASSWORD=ren-admin-password:latest,WHOOP_CLIENT_ID=ren-whoop-client-id:latest,WHOOP_CLIENT_SECRET=ren-whoop-client-secret:latest,OURA_CLIENT_ID=ren-oura-client-id:latest,OURA_CLIENT_SECRET=ren-oura-client-secret:latest,GOOGLE_CLIENT_ID=ren-fitbit-client-id:latest,GOOGLE_CLIENT_SECRET=ren-fitbit-client-secret:latest,GOOGLE_PROJECT_ID=ren-gcp-project-number:latest,SECRET_KEY=ren-owear-secret-key:latest
      - --quiet

  # Celery worker: dedicated worker image (CMD runs worker_cloudrun.sh, which
  # also starts a health server so it satisfies Cloud Run's $PORT probe).
  # --min-instances=1 + --no-cpu-throttling keep it consuming the broker without
  # inbound HTTP; not publicly invokable. It reuses the backend's
  # env/secrets/Cloud SQL. NOTE: like the backend, it needs VPC egress to reach
  # the private Redis IP (_REDIS_HOST); configure the same VPC connector /
  # Direct VPC egress on this service.
  - id: deploy-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_WORKER_SERVICE}
      - --image=${_WORKER_IMAGE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --min-instances=1
      - --max-instances=1
      - --no-cpu-throttling
      - --no-allow-unauthenticated
      - --service-account=${_BACKEND_SERVICE_ACCOUNT}
      - --add-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      - >-
        --set-env-vars=^##^ENVIRONMENT=${_ENVIRONMENT}##DB_HOST=${_DB_HOST}##DB_NAME=${_DB_NAME}##REDIS_HOST=${_REDIS_HOST}##REDIS_PORT=${_REDIS_PORT}##API_BASE_URL=${_API_BASE_URL}##FRONTEND_URL=${_FRONTEND_URL}##API_NAME=${_API_NAME}##DB_POOL_SIZE=8##DB_MAX_OVERFLOW=4##DB_ASYNC_POOL_SIZE=0##DB_ASYNC_MAX_OVERFLOW=0
      - >-
        --set-secrets=DB_USER=ren-postgres-user-name:latest,DB_PASSWORD=ren-postgres-user-password:latest,WHOOP_CLIENT_ID=ren-whoop-client-id:latest,WHOOP_CLIENT_SECRET=ren-whoop-client-secret:latest,OURA_CLIENT_ID=ren-oura-client-id:latest,OURA_CLIENT_SECRET=ren-oura-client-secret:latest,GOOGLE_CLIENT_ID=ren-fitbit-client-id:latest,GOOGLE_CLIENT_SECRET=ren-fitbit-client-secret:latest,GOOGLE_PROJECT_ID=ren-gcp-project-number:latest,SECRET_KEY=ren-owear-secret-key:latest
      - --quiet

  # Celery beat (scheduler): dedicated beat image (CMD runs beat_cloudrun.sh,
  # which also starts a health server for the $PORT probe). MUST stay a single
  # instance (--min-instances=1 --max-instances=1) or scheduled tasks fire
  # multiple times. Same env/secrets/Cloud SQL/VPC requirements as the worker.
  - id: deploy-beat
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_BEAT_SERVICE}
      - --image=${_BEAT_IMAGE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --min-instances=1
      - --max-instances=1
      - --no-cpu-throttling
      - --no-allow-unauthenticated
      - --service-account=${_BACKEND_SERVICE_ACCOUNT}
      - --add-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      # Beat only reads the schedule, so it gets the smallest pools of the three.
      - >-
        --set-env-vars=^##^ENVIRONMENT=${_ENVIRONMENT}##DB_HOST=${_DB_HOST}##DB_NAME=${_DB_NAME}##REDIS_HOST=${_REDIS_HOST}##REDIS_PORT=${_REDIS_PORT}##API_BASE_URL=${_API_BASE_URL}##FRONTEND_URL=${_FRONTEND_URL}##API_NAME=${_API_NAME}##DB_POOL_SIZE=2##DB_MAX_OVERFLOW=1##DB_ASYNC_POOL_SIZE=0##DB_ASYNC_MAX_OVERFLOW=0
      - >-
        --set-secrets=DB_USER=ren-postgres-user-name:latest,DB_PASSWORD=ren-postgres-user-password:latest,WHOOP_CLIENT_ID=ren-whoop-client-id:latest,WHOOP_CLIENT_SECRET=ren-whoop-client-secret:latest,OURA_CLIENT_ID=ren-oura-client-id:latest,OURA_CLIENT_SECRET=ren-oura-client-secret:latest,GOOGLE_CLIENT_ID=ren-fitbit-client-id:latest,GOOGLE_CLIENT_SECRET=ren-fitbit-client-secret:latest,GOOGLE_PROJECT_ID=ren-gcp-project-number:latest,SECRET_KEY=ren-owear-secret-key:latest
      - --quiet

  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_FRONTEND_IMAGE}:$SHORT_SHA
      - --tag=${_FRONTEND_IMAGE}:latest
      - frontend

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_FRONTEND_IMAGE}"]

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_FRONTEND_SERVICE}
      - --image=${_FRONTEND_IMAGE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=${_FRONTEND_SERVICE_ACCOUNT}
      - --set-env-vars=^##^ENVIRONMENT=${_ENVIRONMENT}##VITE_API_URL=${_API_BASE_URL}
      - --quiet

images:
  - ${_BACKEND_IMAGE}:$SHORT_SHA
  - ${_BACKEND_IMAGE}:latest
  - ${_WORKER_IMAGE}:$SHORT_SHA
  - ${_WORKER_IMAGE}:latest
  - ${_BEAT_IMAGE}:$SHORT_SHA
  - ${_BEAT_IMAGE}:latest
  - ${_FRONTEND_IMAGE}:$SHORT_SHA
  - ${_FRONTEND_IMAGE}:latest

timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
