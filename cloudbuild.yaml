# CI/CD: build the backend and frontend images, push them to Artifact
# Registry, and deploy each to its own Cloud Run service.
#
# "On commit to main" is configured on the Cloud Build *trigger* (branch
# filter `^main$`), not in this file. Create the trigger with:
#
#   gcloud builds triggers create github \
#     --name=open-wearables-main \
#     --repo-name=<repo> --repo-owner=<owner> \
#     --branch-pattern='^main$' \
#     --build-config=cloudbuild.yaml
#
# Prerequisites:
#   - Artifact Registry Docker repo `${_REPOSITORY}` exists in `${_LOCATION}`.
#   - Cloud Build service account has roles: Cloud Run Admin
#     (roles/run.admin) and Service Account User (roles/iam.serviceAccountUser)
#     on the Cloud Run runtime service account, plus Artifact Registry Writer.

steps:
  # --- Backend: build -> push -> deploy ------------------------------------
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=GIT_SHA=$COMMIT_SHA
      - --tag=${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/open-wearables-backend:$SHORT_SHA
      - --tag=${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/open-wearables-backend:latest
      - backend

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/open-wearables-backend

  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_BACKEND_SERVICE}
      - --image=${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/open-wearables-backend:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --quiet

  # --- Frontend: build -> push -> deploy -----------------------------------
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/open-wearables-frontend:$SHORT_SHA
      - --tag=${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/open-wearables-frontend:latest
      - frontend

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/open-wearables-frontend

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_FRONTEND_SERVICE}
      - --image=${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/open-wearables-frontend:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --quiet

substitutions:
  _LOCATION: us-central1              # Artifact Registry region
  _REGION: us-central1               # Cloud Run region
  _REPOSITORY: open-wearables        # Artifact Registry repo name
  _BACKEND_SERVICE: open-wearables-backend
  _FRONTEND_SERVICE: open-wearables-frontend

timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
